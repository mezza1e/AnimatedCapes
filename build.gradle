plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:22.0.0-alpha.3"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

test {
	failOnNoDiscoveredTests = false
}

tasks.register('runStressTests', JavaExec) {
	group = 'verification'
	description = 'Runs Animated Capes core stress tests'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.jay.animacapes.test.StressTestRunner'
	jvmArgs '-ea'
}

tasks.register('runDialogAndSyncTests', JavaExec) {
	group = 'verification'
	description = 'Runs Cape Switch and File Dialog stress tests'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.jay.animacapes.test.TestCapeSwitchAndDialogStress'
	jvmArgs '-ea'
}
